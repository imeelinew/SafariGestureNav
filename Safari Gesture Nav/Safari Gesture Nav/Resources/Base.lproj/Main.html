<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="Safari Gesture Nav">
    <h1>Safari Gesture Nav</h1>
    <p>双指轻点后退，三指轻点前进。</p>
    <p>在 Safari「设置 → 扩展」里只保留一项 Safari Gesture Nav。关闭本窗口后程序仍在后台运行，Dock 和菜单栏不会出现。</p>
    <p class="state-unknown">请在 Safari 的“设置 → 扩展”中启用 Safari Gesture Nav。</p>
    <p class="state-on">扩展已启用。请授予辅助功能与输入监控权限。</p>
    <p class="state-off">扩展尚未启用，请前往 Safari 扩展设置开启。</p>
    <button class="open-preferences">打开 Safari 扩展设置…</button>
</body>
</html>
